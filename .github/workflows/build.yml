name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: iamokumu-launcher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish latest APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk iamokumu-launcher.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest iamokumu-launcher.apk --title "Latest build" --notes "Download iamokumu-launcher.apk and install it on the Fire Stick."
